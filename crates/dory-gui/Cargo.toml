[package]
name = "dory-gui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
dory-app = { version = "0.1.0", path = "../dory-app" }
dory-agent = { version = "0.1.0", path = "../dory-agent" }
dory-engine = { version = "0.1.0", path = "../dory-engine" }
dory-sys = { version = "0.1.0", path = "../dory-sys" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["pollster", "xdg-portal", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
