[package]
name = "rillwright-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rillwright"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
rillwright-agent = { version = "0.1.0", path = "../rillwright-agent" }
rillwright-app = { version = "0.1.0", path = "../rillwright-app" }
rillwright-engine = { version = "0.1.0", path = "../rillwright-engine" }
rillwright-sys = { version = "0.1.0", path = "../rillwright-sys" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
