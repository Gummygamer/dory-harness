[package]
name = "dory-serve"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dory-agent = { version = "0.1.0", path = "../dory-agent" }
dory-engine = { version = "0.1.0", path = "../dory-engine" }
dory-sys = { version = "0.1.0", path = "../dory-sys" }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
