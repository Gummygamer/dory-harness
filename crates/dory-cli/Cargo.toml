[package]
name = "dory-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dory-agent = { version = "0.1.0", path = "../dory-agent" }
dory-engine = { version = "0.1.0", path = "../dory-engine" }
dory-sys = { version = "0.1.0", path = "../dory-sys" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
